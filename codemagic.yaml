workflows:
  android-ota-test:
    name: MSS Android OTA Safety Test
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - mss_mobile
      node: 24
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Run MSS tests
        script: npm test

      - name: Build and validate OTA proof bundle
        script: |
          export VITE_API_BASE_URL=https://synqme-api.onrender.com
          # The packaged bundle must contain the same public Supabase configuration
          # as the working Play build. Never fall back to empty credentials.
          test -n "$VITE_SUPABASE_URL" || { echo "MISSING VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "MISSING VITE_SUPABASE_ANON_KEY"; exit 1; }
          npm run build -- --mode mobile
          python3 scripts/package-mobile-ota.py --platform android --native-code 8 --test-banner

    artifacts:
      - ota-publish/*.zip
      - ota-publish/internal-android.json

  android-test:
    name: MSS Android Test
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      groups:
        - mss_mobile
      node: 24
      java: 21
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build MSS mobile
        script: VITE_PLAY_BILLING_ENABLED=true VITE_API_BASE_URL=https://synqme-api.onrender.com npm run build -- --mode mobile

      - name: Generate MySecondSelf native app icons
        script: |
          npx --yes @capacitor/assets@3.0.5 generate --android \
            --iconBackgroundColor '#ffffff' \
            --iconBackgroundColorDark '#ffffff' \
            --splashBackgroundColor '#ffffff' \
            --splashBackgroundColorDark '#ffffff'

      - name: Sync Android
        script: |
          npx cap sync android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  android-play:
    name: MSS Google Play Bundle
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'release/amia-android-1.11'
          include: true
          source: true
      cancel_previous_builds: true
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      groups:
        - mss_mobile
      android_signing:
        - mss_upload
      node: 24
      java: 21

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Check release configuration and run tests
        script: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing public Supabase URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Missing public Supabase key"; exit 1; }
          npm test

      - name: Build MSS mobile
        script: VITE_PLAY_BILLING_ENABLED=true VITE_API_BASE_URL=https://synqme-api.onrender.com npm run build -- --mode mobile

      - name: Generate MySecondSelf native app icons
        script: |
          npx --yes @capacitor/assets@3.0.5 generate --android \
            --iconBackgroundColor '#ffffff' \
            --iconBackgroundColorDark '#ffffff' \
            --splashBackgroundColor '#ffffff' \
            --splashBackgroundColorDark '#ffffff'

      - name: Sync Android
        script: |
          npx cap sync android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build signed Google Play bundle
        script: |
          test -f "$CM_KEYSTORE_PATH" || exit 1
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab > /tmp/mss-aab-signature.txt
          grep -q 'jar verified' /tmp/mss-aab-signature.txt

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
