name: MSS Billing Reconciliation Verification
on:
  push:
    branches:
      - feat/mss-billing-reconciliation-ship-20261105
  pull_request:
    branches:
      - SYNQ.ME
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full MSS tests, including Play billing and one-time trial
        run: npm test
      - name: Validate backend syntax
        run: |
          node --check server/access-policy.js
          node --check server/google-play-billing.js
          node --check server/google-play-rtdn.js
          node --check server/index.js
      - name: Build production browser client
        run: npm run build
