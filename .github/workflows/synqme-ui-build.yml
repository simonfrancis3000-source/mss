name: SYNQ.ME UI build

on:
  push:
    branches: [SYNQ.ME, feature/synqme-robot-voice-ui]
    paths:
      - "index.html"
      - "src/**"
      - "server/**"
      - "test/**"
      - "docs/**"
      - "supabase/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/synqme-ui-build.yml"
  pull_request:
    branches: [SYNQ.ME]
    paths:
      - "index.html"
      - "src/**"
      - "server/**"
      - "test/**"
      - "docs/**"
      - "supabase/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/synqme-ui-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Install and build SYNQ.ME
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify toolchain
        run: |
          node --version
          npm --version
      - name: Check JavaScript syntax
        run: |
          node --check server/index.js
          node --check src/synqme.js
          node --check src/phonic-voice.js
          node --check public/phonic-pcm-processor.worklet.js
      - name: Install dependencies and refresh the npm lockfile
        run: npm install --no-audit --no-fund
      - name: Verify retired local-model dependencies are absent
        run: |
          node --input-type=commonjs <<'NODE'
          const lock = require('./package-lock.json');
          const retired = ['@huggingface/transformers', 'kokoro-js', 'onnxruntime-node', 'onnxruntime-web'];
          const present = retired.filter((name) => lock.packages[`node_modules/${name}`]);
          if (present.length) {
            console.error('Unexpected retired packages in lockfile:', present.join(', '));
            process.exit(1);
          }
          console.log('Phonic voice path has no legacy browser model runtime dependencies.');
          NODE
      - name: Run persona and memory-index tests
        run: npm test
      - name: Build SYNQ.ME
        run: npm run build
