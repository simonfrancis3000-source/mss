name: SYNQ.ME UI build

on:
  push:
    branches: [feature/synqme-robot-voice-ui]
    paths:
      - "index.html"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/synqme-ui-build.yml"
  pull_request:
    branches: [SYNQ.ME]
    paths:
      - "index.html"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/synqme-ui-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build SYNQ.ME
        run: npm run build
