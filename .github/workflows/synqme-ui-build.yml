name: SYNQ.ME UI build

on:
  push:
    branches: [main, feature/synqme-robot-voice-ui, feature/phonic-voice-chat, feature/amia-deepseek-engine]
    paths:
      - "index.html"
      - "src/**"
      - "server/**"
      - "admin/**"
      - "vite.config.js"
      - "supabase/migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/synqme-ui-build.yml"
  pull_request:
    branches: [main, SYNQ.ME, feature/synqme-robot-voice-ui, feature/amia-deepseek-engine]
    paths:
      - "index.html"
      - "src/**"
      - "server/**"
      - "admin/**"
      - "vite.config.js"
      - "supabase/migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/synqme-ui-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Install and build SYNQ.ME
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify toolchain
        run: |
          node --version
          npm --version
      - name: Check JavaScript syntax
        run: |
          node --check server/index.js
          node --check server/usage.js
          node --check server/amia/instructions.js
          node --check server/amia/memory.js
          node --check server/amia/router.js
          node --check server/amia/search.js
          node --check server/amia/index.js
          node --check src/synqme.js
          node --check src/admin.js
          node --check src/phonic-voice.js
          node --check public/phonic-pcm-processor.worklet.js
      - name: Install dependencies and refresh the npm lockfile
        run: npm install --no-audit --no-fund
      - name: Verify a single Transformers.js runtime
        run: npm ls @huggingface/transformers
      - name: Build SYNQ.ME
        run: npm run build
