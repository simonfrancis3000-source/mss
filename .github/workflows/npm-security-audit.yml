name: npm security audit

on:
  pull_request:
    branches: [SYNQ.ME]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Reconcile lockfile with manifest
        env:
          PUSH_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Regenerate lockfile after removing unused model dependencies"
            git push origin "HEAD:$PUSH_BRANCH"
          fi
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run npm audit and print package-level findings
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_status=$?
          set -e
          echo "npm audit exit code: $audit_status"
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const totals = report.metadata?.vulnerabilities ?? {};
          console.log('Vulnerability totals:', JSON.stringify(totals));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              via: item.via,
              effects: item.effects,
              fixAvailable: item.fixAvailable
            }));
          }
          if ((totals.total ?? 0) > 0 || report.error) process.exit(1);
          NODE
      - name: Upload full npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run application tests
        run: npm test
      - name: Build production frontend
        run: npm run build
