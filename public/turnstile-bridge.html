<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow" />
  <title>MSS mobile security verification</title>
  <style>
    :root { color-scheme: light; }
    html, body { width:100%; margin:0; padding:0; background:transparent; overflow:hidden; }
    body { font-family:system-ui,-apple-system,sans-serif; }
    #turnstile { width:100%; display:flex; align-items:center; justify-content:center; min-height:70px; }
    #status { font-size:12px; line-height:1.3; text-align:center; color:#424e5d; margin:0; }
    #status:empty {display:none}
  </style>
</head>
<body>
  <div id="turnstile" aria-label="Cloudflare security check"></div>
  <p id="status" role="status" aria-live="polite"></p>
  <script>
    "use strict";
    // This standalone page runs from the Cloudflare-allowed HTTPS hostname.
    // It NEVER accepts passwords, email addresses or session tokens.
    // Only the one-time Turnstile challenge token is returned to the native app.
    (function () {
      const SITE_KEY = "0x4AAAAAAFxQtK2-J-A-K9oc";
      const ALLOWED_PARENTS = new Set(["http://localhost", "https://localhost", "capacitor://localhost"]);
      const nonce = new URLSearchParams(location.hash.slice(1)).get("nonce") || "";
      const output = document.getElementById("status");
      const target = document.getElementById("turnstile");
      let parentOrigin = "";
      let widgetId = null;
      let loading = null;

      function send(kind, extra = {}) {
        if (parentOrigin) {
          window.parent.postMessage({ type: "mss-turnstile:" + kind, nonce, ...extra }, parentOrigin);
        }
      }
      function status(message) { output.textContent = message; }
      function fail(message) { status(message); send("error", { message }); }
      function initialize() {
        if (widgetId !== null) { send("ready"); return; }
        if (loading) return;
        loading = new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
          script.async = true;
          script.onload = () => window.turnstile?.render ? resolve() : reject(new Error("Security verification is unavailable."));
          script.onerror = () => reject(new Error("Could not load Cloudflare verification. Check your connection."));
          document.head.appendChild(script);
        }).then(() => {
          widgetId = window.turnstile.render(target, {
            sitekey: SITE_KEY,
            theme: "light",
            size: "flexible",
            "response-field": false,
            callback(token) {
              status("");
              send("token", { token });
            },
            "expired-callback"() {
              status("Security check expired. Complete it again.");
              send("expired");
            },
            "timeout-callback"() {
              status("Security check timed out. Try again.");
              send("expired");
            },
            "error-callback"(code) {
              fail("Cloudflare verification failed. Try reopening this screen.");
              return false;
            }
          });
          if (widgetId === null || widgetId === undefined) throw new Error("Could not initialize security verification.");
          send("ready");
        }).catch((error) => {
          fail(error?.message || "Security verification is unavailable.");
          loading = null;
        });
      }

      if (!/^[0-9a-f]{32}$/.test(nonce) || window.parent === window) {
        status("Open this security check from the MySecondSelf mobile app.");
        return;
      }
      window.addEventListener("message", (event) => {
        const message = event.data;
        if (event.source !== window.parent || !ALLOWED_PARENTS.has(event.origin) ||
            !message || message.nonce !== nonce) return;
        if (message.type === "mss-turnstile:init") {
          if (parentOrigin && parentOrigin !== event.origin) return;
          parentOrigin = event.origin;
          initialize();
        } else if (message.type === "mss-turnstile:reset" && parentOrigin === event.origin) {
          status("");
          if (widgetId !== null && window.turnstile?.reset) {
            window.turnstile.reset(widgetId);
          } else {
            initialize();
          }
        }
      });
    })();
  </script>
</body>
</html>
